name: Aristotle
description: 'Aristotle (heyaristotle.com) is an AI tutoring platform that delivers personalized, one-on-one,
  dialogue-based instruction across all subjects. Rather than lecturing or simply marking answers wrong, it
  uses a Socratic, voice-first approach to diagnose conceptual misconceptions and verifies each response
  turn-by-turn before delivering it to the student. Positioned as an affordable alternative to human tutors,
  its methodology is grounded in learning science (Bloom''s two-sigma work, ICAP, LearnLM benchmarks).
  Backed by True Ventures. Sector: EdTech / AI education. No public developer API or SDK surface at this time.'
